services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tividy-backend
    ports:
      - "8080:8080"
    networks:
      - tividy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tividy-frontend
    ports:
      - "3000:80"
    networks:
      - tividy
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

networks:
  tividy:
    driver: bridge