server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router (react-router v8 in your package.json)
    # needs every unknown path to serve index.html, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container by service name.
    # React calls /api/... (relative), nginx forwards to http://backend:8080.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health endpoint for compose depends_on
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hashed static assets (Vite emits content-hashed names) — long cache
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}