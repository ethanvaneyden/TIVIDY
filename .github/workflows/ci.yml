name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: Build & Test (Ubuntu, GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ build-essential

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build --target tividy_tests --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload built executable (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tividy-linux
          path: build/tividy
          if-no-files-found: error